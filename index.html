<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wrestle Arena Online</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#fff;font-family:system-ui,Arial;overflow:hidden}#top{height:74px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#171d2c;border-bottom:1px solid #30384e}.hp{width:31vw;max-width:380px}.bar{height:18px;background:#3a4150;border-radius:20px;overflow:hidden;border:2px solid #687086}.fill{height:100%;background:#28d66d;width:100%;transition:.12s}.name{text-align:center;font-weight:800;margin-bottom:4px}.arena{position:relative;height:calc(100vh - 74px);background:radial-gradient(circle at 50% 15%,#34445e,#111725 58%,#090d15);overflow:hidden}.floor{position:absolute;bottom:0;width:100%;height:25%;background:linear-gradient(#303849,#161b27);border-top:3px solid #68748d}.fighter{position:absolute;width:56px;height:100px;transform:translate(-50%,-100%);transition:transform .04s linear}.body{position:absolute;bottom:8px;left:15px;width:27px;height:52px;border-radius:13px;background:#39a8ff;box-shadow:0 0 18px #39a8ff55}.head{position:absolute;top:0;left:15px;width:27px;height:27px;border-radius:50%;background:#ffd1ae}.arm,.leg{position:absolute;background:#ffd1ae;border-radius:8px;transform-origin:top}.arm{width:10px;height:38px;top:40px}.leg{width:12px;height:45px;bottom:-2px;background:#dfe8f5}.a1{left:9px;transform:rotate(22deg)}.a2{right:9px;transform:rotate(-22deg)}.l1{left:15px;transform:rotate(8deg)}.l2{right:15px;transform:rotate(-8deg)}.p2 .body{background:#ff4f6d;box-shadow:0 0 18px #ff4f6d55}.tag{position:absolute;top:-28px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:#0008;padding:2px 7px;border-radius:10px}.hit{animation:hit .16s linear}.ko{filter:grayscale(1);opacity:.65}@keyframes hit{50%{filter:brightness(2)}}#hud{text-align:center;position:absolute;top:12px;width:100%;pointer-events:none}.room{font-size:13px;opacity:.8}.status{font-weight:800;margin-top:5px}.panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080c15dd;z-index:5}.card{width:min(430px,92vw);background:#1b2232;padding:25px;border-radius:22px;box-shadow:0 15px 60px #0008;text-align:center}.card h1{margin:0 0 8px}.card input{width:100%;padding:14px;border-radius:12px;border:1px solid #4b5770;background:#0f1420;color:#fff;font-size:18px;text-align:center;text-transform:uppercase}.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#3d8cff;color:white;font-size:17px;font-weight:800}.small{opacity:.65;font-size:13px;margin-top:12px}.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;z-index:4;pointer-events:none}.pad{display:flex;gap:8px;pointer-events:auto}.ctrl{width:58px;height:58px;border:0;border-radius:50%;background:#ffffff1c;color:white;font-size:22px;font-weight:800;touch-action:none}.attack{background:#ff475733}.restart{display:none;position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);padding:13px 24px;border:0;border-radius:12px;background:#3d8cff;color:#fff;font-weight:800}
</style></head><body>
<div id="top"><div class="hp"><div class="name">PLAYER 1</div><div class="bar"><div id="hp1" class="fill"></div></div></div><div style="font-weight:900">VS</div><div class="hp"><div class="name">PLAYER 2</div><div class="bar"><div id="hp2" class="fill"></div></div></div></div>
<div class="arena" id="arena"><div class="floor"></div><div id="hud"><div class="room">WRESTLE ARENA ONLINE</div><div id="status" class="status">Đang kết nối...</div></div><div class="controls"><div class="pad"><button class="ctrl" data-k="left">◀</button><button class="ctrl" data-k="right">▶</button><button class="ctrl" data-k="jump">▲</button></div><div class="pad"><button class="ctrl attack" data-a="punch">👊</button><button class="ctrl attack" data-a="kick">🦵</button><button class="ctrl attack" data-a="grab">🤼</button><button class="ctrl" data-k="guard">🛡</button></div></div></div>
<div class="panel" id="panel"><div class="card"><h1>🥊 WRESTLE ARENA</h1><p>Đấu 2 người online</p><input id="room" maxlength="8" placeholder="MÃ PHÒNG"><button class="btn" id="join">Vào / Tạo phòng</button><div class="small">Người thứ hai nhập cùng mã phòng.</div></div></div><button class="restart" id="restart">Đấu lại</button>
<script>
const $=s=>document.querySelector(s), arena=$("#arena"), status=$("#status"), panel=$("#panel"), roomInput=$("#room");
let ws,myId="",joined=false,keys={left:false,right:false,jump:false,guard:false},attack=null,last=[];
function connect(){
 const proto=location.protocol==="https:"?"wss":"ws"; ws=new WebSocket(proto+"://"+location.host);
 ws.onopen=()=>status.textContent="Đã kết nối • nhập mã phòng";
 ws.onclose=()=>status.textContent="Mất kết nối";
 ws.onerror=()=>status.textContent="Không thể kết nối server";
 ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="joined"){myId=m.id;joined=true;panel.style.display="none";status.textContent="Phòng "+m.room+" • chờ đối thủ";}if(m.type==="error"){status.textContent=m.message}if(m.type==="state")render(m.players)};
}
function send(){if(ws&&ws.readyState===1&&joined)ws.send(JSON.stringify({type:"input",...keys,attack}));attack=null}
$("#join").onclick=()=>{let r=roomInput.value.trim().toUpperCase()||Math.random().toString(36).slice(2,8).toUpperCase();if(ws.readyState===1)ws.send(JSON.stringify({type:"join",room:r}))};
document.querySelectorAll("[data-k]").forEach(b=>{let k=b.dataset.k;["pointerdown","touchstart"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=true}));["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}))});
document.querySelectorAll("[data-a]").forEach(b=>{b.addEventListener("pointerdown",e=>{e.preventDefault();attack=b.dataset.a})});
document.addEventListener("keydown",e=>{let m={a:"left",d:"right",w:"jump",s:"guard"};if(m[e.key.toLowerCase()])keys[m[e.key.toLowerCase()]]=true;if(e.key==="j")attack="punch";if(e.key==="k")attack="kick";if(e.key==="l")attack="grab"});
document.addEventListener("keyup",e=>{let m={a:"left",d:"right",w:"jump",s:"guard"};if(m[e.key.toLowerCase()])keys[m[e.key.toLowerCase()]]=false});
setInterval(send,33);
function render(ps){
 ps.sort((a,b)=>a.id.localeCompare(b.id)); $("#hp1").style.width=(ps[0]?.hp||0)+"%";$("#hp2").style.width=(ps[1]?.hp||0)+"%";
 status.textContent=ps.length<2?"Đang chờ người chơi thứ 2":"⚔️ ĐANG CHIẾN ĐẤU";
 for(const p of ps){let el=document.getElementById("f"+p.id);if(!el){el=document.createElement("div");el.id="f"+p.id;el.className="fighter "+(ps[1]?.id===p.id?"p2":"");el.innerHTML='<div class="tag"></div><div class="head"></div><div class="body"></div><div class="arm a1"></div><div class="arm a2"></div><div class="leg l1"></div><div class="leg l2"></div>';arena.appendChild(el)}
 el.style.left=(p.x/1000*100)+"%";el.style.bottom=(p.y+40)+"px";el.querySelector(".tag").textContent=p.id===myId?"BẠN":"ĐỐI THỦ";el.classList.toggle("hit",p.stun>0);el.classList.toggle("ko",p.hp<=0);
 }
 if(ps.length===2&&ps.some(p=>p.hp<=0)){$("#restart").style.display="block";status.textContent=ps.find(p=>p.hp<=0)?.id===myId?"💀 BẠN THUA":"🏆 BẠN THẮNG"}
}
$("#restart").onclick=()=>{ws.send(JSON.stringify({type:"restart"}));$("#restart").style.display="none"};connect();
</script></body></html>
